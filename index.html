<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ITIL5 Lernapp</title>
    <script type="module" src="/src/main.ts"></script>
  </head>

  <body>
    <main>
      <section class="hero">
        <h1>ITIL5 Lernapp</h1>
        <p class="muted">
          Multiple-Choice Training fuer die ITIL Foundation Version 5 Zertifizierung.
        </p>

        <div class="grid">
          <span class="pill">Fragen: <strong id="total">0</strong></span>
          <span class="pill">Aktuell: <strong id="current">0</strong></span>
          <span class="pill">Score: <strong id="score">0</strong></span>
          <span class="pill success">Richtig: <strong id="correct">0</strong></span>
          <span class="pill danger">Falsch: <strong id="wrong">0</strong></span>
          <span class="pill">Modus: <strong id="modeLabel">Lernen</strong></span>
        </div>

        <div class="row">
          <button id="learnBtn" type="button">Lernmodus starten</button>
          <button id="examBtn" class="secondary" type="button">Pruefungsmodus starten</button>
          <button id="resetBtn" class="secondary" type="button">Neu mischen</button>
        </div>

        <div class="progress">
          <div id="bar" class="bar"></div>
        </div>
      </section>

      <section class="card">
        <div class="small muted" id="topic"></div>
        <div class="question" id="question">Starte einen Modus.</div>
        <div id="answers" class="answers"></div>
        <div id="feedback" class="explain hidden"></div>

        <div class="row">
          <button id="checkBtn" class="hidden" type="button">Antwort pruefen</button>
          <button id="nextBtn" class="hidden secondary" type="button">Naechste Frage</button>
        </div>
      </section>
    </main>
  </body>
</html>
